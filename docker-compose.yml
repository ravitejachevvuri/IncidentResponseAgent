services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-production_memory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-production_memory}
      POSTGRES_DB: ${POSTGRES_DB:-production_memory}
    ports:
      # Host-side port only matters if you want to reach Postgres directly from
      # the host (e.g. via psql); the backend always talks to it over the internal
      # Docker network as db:5432. Mapped to 5433 to avoid clashing with any other
      # Postgres container already using 5432 on the host.
      - "5433:5432"
    volumes:
      - pm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-production_memory}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-production_memory}:${POSTGRES_PASSWORD:-production_memory}@db:5432/${POSTGRES_DB:-production_memory}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      HINDSIGHT_API_KEY: ${HINDSIGHT_API_KEY:-}
      HINDSIGHT_BASE_URL: ${HINDSIGHT_BASE_URL:-}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  pm_pgdata:
